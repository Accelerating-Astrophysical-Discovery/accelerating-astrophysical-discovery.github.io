bio = "Judit Pérez Romero is a junior researcher at IFIC CSIC/UV in Valencia, specialising in indirect dark matter searches with gamma-ray observations from Fermi-LAT and CTAO. Her work combines gamma-ray data analysis, cosmic-ray astrophysics, and modelling of diffuse emission to constrain dark matter properties across complementary targets and instruments. She develops machine-learning and deep-learning methods for gamma-ray analysis and coordinates scientific groups within Fermi-LAT, CTAO, and EuCAIF. Through the consortium, she aims to advance data-driven, multi-instrument approaches to astrophysical discovery."
