bio = "As a junior researcher at Institut de Física Corpuscular (IFIC CSIC/UV) in Valencia, I work on astroparticle physics specializing in indirect searches for dark matter using gamma-ray observations. My research focuses on the analysis and interpretation of gamma-ray data from space- and ground-based observatories, particularly Fermi-LAT and the Cherenkov Telescope Array Observatory (CTAO). My expertise comprises analysis of gamma-ray data in terms of dark matter searches, cosmic-ray astrophysics, and the modelling of diffuse astrophysical emissions. My work explores the complementarity of different astrophysical targets and instruments to constrain dark matter properties. Alongside these studies, I develop/apply machine-learning/AI methods for gamma-ray data analysis, including deep-learning approaches. As a member of the Fermi-LAT Collaboration, the CTAO Consortium, and the EuCAIF network, I lead and coordinate different scientific task forces and working groups. My research interests span dark matter phenomenology, gamma-ray astronomy, diffuse astrophysical emission, machine learning/AI for gamma-ray analysis, and multi-messenger astrophysics. In the context of this consortium, I am particularly interested in developing data-driven and multi-instrument approaches to address the challenges of modern astrophysical data analysis."
