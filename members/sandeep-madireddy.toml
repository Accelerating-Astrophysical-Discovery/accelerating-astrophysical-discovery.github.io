bio = "Sandeep Madireddy is a computer scientist in the Mathematics and Computer Science Division at Argonne National Laboratory, and a core member of the NSF-Simons SkAI Institute. His research spans multimodal and large-scale generative AI applied to diverse scientific data modalities, evaluation and safety of frontier AI models, inference-time and adaptive compute for resource-efficient reasoning, and uncertainty quantification."
