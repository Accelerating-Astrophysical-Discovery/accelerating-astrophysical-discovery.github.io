bio = "Astrophysicist turned data and AI scientist, I am a research engineer at CNRS/LAPP working at the interface of astroparticle physics, machine learning and scientific software. Over the past years, I have led the development of GammaLearn, a research programme focused on deep learning for the reconstruction of Imaging Atmospheric Cherenkov Telescope data, in particular for CTAO/LST-1. I am also deeply involved in Open Science and research software quality and publication through several European projects."
