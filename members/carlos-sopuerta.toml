bio = """Carlos F. Sopuerta is a theoretical physicist working at the Institute of Space Sciences (ICE) of the Spanish National Research Council (CSIC) since 2007, where he is a Research Scientist (Investigador Científico).
My research is in Relativistic Astrophysics and Gravitation, with focus on Gravitational Wave Astronomy. Over the course of my career I have worked on a broad range of topics, from theoretical studies to studies for the design of a space-based gravitational-wave observatory like LISA: modeling of gravitational wave sources; astrophysics, cosmology, and fundamental physics with gravitational-wave observations; numerical relativity; and data analysis algorithms for gravitational-wave astronomy.
On the data side, I am particularly interested in applying Artificial Intelligence methods to the Global Fit problem that space-based observatories have to face. That is, the need to disentangle a number of overlapping signals with different morphologies. This represents a major challenge to obtaining unbiased estimates of the physical parameters of the source. This is of great relevance for new discoveries in fundamental physics with gravitational waves, such as tests of the geometry of black holes and of the validity of General Relativity. These discoveries will require exquisite precision in the extraction of the relevant physical parameters."""
