bio = "Carlos F. Sopuerta is a theoretical physicist at the Institute of Space Sciences (ICE-CSIC), specialising in relativistic astrophysics and gravitational-wave astronomy. His research spans source modelling, numerical relativity, and data analysis for space-based observatories such as LISA. He is particularly interested in AI methods for disentangling overlapping gravitational-wave signals, enabling precise measurements of source properties and tests of black-hole geometry and general relativity."
